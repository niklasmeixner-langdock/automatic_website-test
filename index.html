<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automatic Website Test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main {
      width: min(680px, 100%);
      padding: 56px 48px;
      border: 1px solid #dbe3ef;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(31, 52, 84, 0.10);
      text-align: center;
    }
    .eyebrow { margin: 0 0 14px; color: #4f6b95; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 4rem); line-height: 1; letter-spacing: -0.05em; }
    p { margin: 22px auto 0; max-width: 480px; color: #5d6b82; font-size: 1.08rem; line-height: 1.7; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 30px; padding: 10px 14px; border-radius: 999px; background: #e8f7ef; color: #217346; font-size: 0.92rem; font-weight: 700; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #35a866; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GitHub Pages</p>
    <h1>Hello, world.</h1>
    <p>This is a simple website deployed from the <strong>automatic_website-test</strong> repository.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span>Site is ready</div>
  </main>
</body>
</html>
